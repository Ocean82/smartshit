name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: "--max-old-space-size=4096"
      # onnxruntime-node downloads CUDA EP binaries from NuGet during
      # postinstall. CI doesn't run GPU inference, and the download is flaky
      # (frequent ETIMEDOUT on runner egress), so skip it — the bundled CPU
      # runtime is used for build and test.
      ONNXRUNTIME_NODE_INSTALL: "skip"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - run: npm ci
      - run: npm ci --prefix server
      - run: npm audit --audit-level=high || true
      - run: npm audit --audit-level=high --prefix server || true
      - run: npm run lint:ci
      - run: npm run typecheck
      - run: npm run test --prefix server
      - run: npm run test
      - run: npm run build --prefix server
      - run: npm run build
