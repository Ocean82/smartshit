name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly dependency advisory sweep (Mondays 06:00 UTC). Advisory only.
    - cron: '0 6 * * 1'
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: "--max-old-space-size=4096"
      # onnxruntime-node downloads CUDA EP binaries from NuGet during
      # postinstall. CI doesn't run GPU inference, and the download is flaky
      # (frequent ETIMEDOUT on runner egress), so skip it — the bundled CPU
      # runtime is used for build and test.
      ONNXRUNTIME_NODE_INSTALL: "skip"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - run: npm ci
      - run: npm ci --prefix server
      # Fail the build only on a real CRITICAL advisory. We parse `npm audit
      # --json` rather than trusting its exit code, because npm's legacy audit
      # endpoint is being retired and intermittently returns 400/410 — that
      # infrastructure error must NOT fail an unrelated PR. A non-JSON / errored
      # response is logged and skipped; genuine criticals still block.
      # (High/moderate drift is surfaced non-blocking by the scheduled `audit`
      # job below.)
      - name: Audit (root + server) — critical only, brownout-tolerant
        run: |
          audit_dir() {
            local dir="$1"
            local json
            json=$(npm audit --json --prefix "$dir" 2>/dev/null || true)
            local critical
            critical=$(node -e '
              let s="";
              process.stdin.on("data",d=>s+=d);
              process.stdin.on("end",()=>{
                try {
                  const c=JSON.parse(s).metadata?.vulnerabilities?.critical;
                  if (typeof c!=="number") { console.error("audit: no parseable result (endpoint brownout?) — skipping"); process.stdout.write("0"); }
                  else process.stdout.write(String(c));
                } catch { console.error("audit: non-JSON response (endpoint brownout?) — skipping"); process.stdout.write("0"); }
              });
            ' <<< "$json")
            echo "$dir: critical=$critical"
            if [ "$critical" -gt 0 ]; then
              echo "::error::$dir has $critical critical advisory/advisories"
              npm audit --audit-level=critical --prefix "$dir" || true
              return 1
            fi
          }
          audit_dir "." && audit_dir "server"
      - run: npm run lint:ci
      - run: npm run typecheck
      - run: npm run test --prefix server
      - run: npm run test
      # Real-WASM formula engine tier (separate from the stubbed unit tests
      # above). Loads the actual @ocean8219/formualizer via vite-plugin-wasm.
      - run: npm run test:realengine
      - run: npm run build --prefix server
      - run: npm run build

  # Advisory-only dependency audit. Runs on the weekly schedule (and on demand).
  # Never blocks a merge — instead it opens/updates a tracking issue when a
  # high-or-worse advisory is found, so drift is visible without gating PRs.
  audit:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    env:
      ONNXRUNTIME_NODE_INSTALL: "skip"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - run: npm ci
      - run: npm ci --prefix server

      - name: Audit (root + server)
        id: audit
        run: |
          set +e
          {
            echo "## Root"
            npm audit --audit-level=high
            root=$?
            echo ""
            echo "## Server"
            npm audit --audit-level=high --prefix server
            server=$?
          } > audit-report.txt 2>&1
          cat audit-report.txt
          # npm audit exits non-zero for a real finding OR an endpoint error
          # (the legacy audit endpoint is being retired and returns 400/410).
          # Only file an issue on a genuine finding — a brownout must not spam
          # the tracker. Detect the endpoint error and treat it as "no finding".
          if grep -qiE 'audit endpoint returned an error|Bad Request|400|410|ENOAUDIT|Invalid package tree' audit-report.txt; then
            echo "npm audit endpoint error (brownout) — not filing an issue"
            echo "failed=false" >> "$GITHUB_OUTPUT"
          elif [ "$root" -ne 0 ] || [ "$server" -ne 0 ]; then
            echo "failed=true" >> "$GITHUB_OUTPUT"
          else
            echo "failed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Open or update advisory issue
        if: steps.audit.outputs.failed == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('audit-report.txt', 'utf8').slice(0, 60000);
            const title = 'Dependency advisory: npm audit found high-or-worse issues';
            const body = [
              'The scheduled dependency audit found advisories at `high` or above.',
              '',
              'This is advisory only — it does not block CI. Review and, where a fix',
              'is available, run `npm audit fix` (root) and/or `npm audit fix --prefix server`.',
              '',
              '<details><summary>npm audit output</summary>',
              '',
              '```',
              report,
              '```',
              '',
              '</details>',
              '',
              `_Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}_`,
            ].join('\n');
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'dependencies',
              per_page: 100,
            });
            const found = existing.data.find((i) => i.title === title);
            if (found) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: found.number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['dependencies'],
              });
            }
