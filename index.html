<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1e40af" />
    <meta name="color-scheme" content="light" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="smartsht" />
    <meta name="application-name" content="smartsht" />
    <meta name="description" content="AI-powered spreadsheet that understands plain English. Build budgets, track expenses, generate invoices, and catch formula errors — no formulas required. Free AI budget planner and expense tracker." />
    <meta name="author" content="smartsht" />
    <meta name="robots" content="noindex, nofollow" />

    <!-- Open Graph -->
    <meta property="og:title" content="smartsh!t — AI Budget & Spreadsheet Assistant" />
    <meta property="og:description" content="AI spreadsheet for budgets, expenses, and invoices. Describe what you need in plain English — no formulas, no tutorials. Free to start." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://smartsht.com/app" />
    <meta property="og:image" content="https://smartsht.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="smartsht AI spreadsheet interface with natural language chat" />
    <meta property="og:site_name" content="smartsht" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="smartsh!t — AI Budget & Spreadsheet Assistant" />
    <meta name="twitter:description" content="AI spreadsheet for everyday people. Build budgets in plain English. No formulas required." />
    <meta name="twitter:image" content="https://smartsht.com/og-image.png" />
    <meta name="twitter:image:alt" content="smartsht AI spreadsheet interface with natural language chat" />

    <link rel="canonical" href="https://smartsht.com/app" />
    <!-- Paths are relative to Vite's base (/app/); do NOT hardcode /app/ here or
         the build emits /app/app/... . `base: '/app/'` in vite.config prepends it. -->
    <link rel="manifest" href="manifest.json" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="favicon-48x48.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="pwa-icon-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png" />
    <title>smartsh!t — AI Budget & Spreadsheet Assistant</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('./sw.js?v=3', { scope: './' }).catch(() => {});
        });
      }
    </script>
  </body>
</html>
