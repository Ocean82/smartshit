#-------------------------------------------------------------------------------#
#               Qodana analysis is configured by qodana.yaml file               #
#             https://www.jetbrains.com/help/qodana/qodana-yaml.html            #
#-------------------------------------------------------------------------------#
version: "1.0"
profile:
  name: qodana.recommended
include:
  - name: ES2015ModulesMissingOrUnnecessaryImport
  - name: Eslint
exclude:
  - name: All
    paths:
      - .github/skills/impeccable/scripts
bootstrap: npm ci
failureConditions:
  severityThresholds:
    critical: 0
    high: 25
  testCoverageThresholds:
    total: 50
linter: jetbrains/qodana-js:2026.1
