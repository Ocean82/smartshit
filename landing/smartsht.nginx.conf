# Markdown for agents. `map` is http-context only, so it stays outside `server`.
# $wants_markdown is 1 when Accept contains text/markdown — the same check as
# wantsMarkdown() in scripts/markdownForAgents.mjs. Browsers do not send that
# type, so they still receive HTML.
map $http_accept $wants_markdown {
    default 0;
    ~*text/markdown 1;
}

server {
    server_name smartsht.com www.smartsht.com;

    root /var/www/smartsht;
    index index.html;

    # ─── Body size limit (must match Express workbookBodyLimit) ───
    client_max_body_size 25m;

    # ─── Security Headers ───
    # Keep this CSP line identical to landing/security-headers.inc (deploy installs
    # that file to /etc/nginx/snippets/smartsht-security-headers.conf for locations
    # that set their own add_header and would otherwise drop these).
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    # One year + preload. If PageSpeed still reports a low max-age, Cloudflare is
    # overriding this — raise HSTS there to match (and only then submit preload).
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    # Checkout is a full-page redirect to Stripe-hosted Checkout — the SPA does
    # not load Stripe.js, so js.stripe.com / hooks.stripe.com / api.stripe.com
    # are intentionally omitted from CSP. Re-add them if Elements / Payment
    # Element is introduced. Clerk origins below are the concrete hosts the
    # Frontend API and CAPTCHA use (not a product nickname).
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' 'wasm-unsafe-eval' https://static.cloudflareinsights.com https://*.clerk.accounts.dev https://clerk.smartsht.com https://challenges.cloudflare.com https://*.protect.clerk.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://img.clerk.com https://launchbison.com; connect-src 'self' https://*.clerk.accounts.dev https://clerk.smartsht.com https://api.clerk.com https://clerk-telemetry.com https://*.clerk-telemetry.com https://*.protect.clerk.com https://challenges.cloudflare.com https://openrouter.ai https://api.groq.com https://router.huggingface.co; frame-src https://*.clerk.accounts.dev https://clerk.smartsht.com https://challenges.cloudflare.com https://*.protect.clerk.com; worker-src 'self' blob:;" always;

    # ─── Compression ───
    # application/wasm is included so the large engine binaries (formualizer
    # ~8.6MB, ONNX runtime ~27MB) are compressed in transit (~4x smaller). They
    # are hashed + 30d-cached, so the gzip CPU cost is a one-time hit per client.
    # For better ratios, install ngx_brotli and add `brotli on; brotli_types
    # application/wasm ...;` here — omitted by default because a missing module
    # would fail `nginx -t` and abort the deploy.
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1000;
    gzip_types text/plain text/css text/markdown application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml application/wasm;

    # ─── API proxy — routes to Express server ───
    location /api/ {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Load-bearing auth / webhook headers. nginx usually forwards client
        # request headers when proxy_pass_request_headers is on (default), but
        # set these explicitly so a future proxy_set_header / auth_request
        # change cannot silently drop Clerk JWTs or Stripe signatures.
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Stripe-Signature $http_stripe_signature;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 120s;
        chunked_transfer_encoding off;
    }

    # ─── Health check ───
    location /health {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # ─── AI / crawler text files (must not fall through to index.html) ───
    location = /llms.txt {
        default_type text/plain;
        add_header Content-Type "text/plain; charset=utf-8" always;
        try_files /llms.txt =404;
    }

    location = /robots.txt {
        default_type text/plain;
        try_files /robots.txt =404;
    }

    location = /sitemap.xml {
        default_type application/xml;
        try_files /sitemap.xml =404;
    }

    # ─── Markdown for Agents (Accept: text/markdown content negotiation) ───
    # HTML remains the default. Agents that send Accept: text/markdown are
    # rewritten to pre-generated .md siblings. Direct .md URLs also work
    # (llmstxt.org). Token counts are refreshed by `npm run markdown:pages`.
    # https://developers.cloudflare.com/fundamentals/reference/markdown-for-agents/

    location = / {
        if ($wants_markdown = 1) {
            rewrite ^ /index.md last;
        }
        # URI stays "/" (no extension), so the type must be forced.
        default_type text/html;
        charset utf-8;
        try_files /index.html =404;
        add_header Vary "Accept" always;
        add_header Link "</index.md>; rel=\"alternate\"; type=\"text/markdown\", </llms.txt>; rel=\"describedby\"" always;
        # HTML must revalidate so logo/SEO deploys are visible; binaries stay long-cached below.
        add_header Cache-Control "no-cache, must-revalidate" always;
        include /etc/nginx/snippets/smartsht-security-headers.conf;
    }

    location = /index.html {
        if ($wants_markdown = 1) {
            rewrite ^ /index.md last;
        }
        charset utf-8;
        add_header Vary "Accept" always;
        add_header Link "</index.md>; rel=\"alternate\"; type=\"text/markdown\", </llms.txt>; rel=\"describedby\"" always;
        add_header Cache-Control "no-cache, must-revalidate" always;
        include /etc/nginx/snippets/smartsht-security-headers.conf;
    }

    location = /index.md {
        types { text/markdown md; }
        default_type text/markdown;
        charset utf-8;
        charset_types text/markdown;
        add_header Content-Type "text/markdown; charset=utf-8" always;
        add_header Vary "Accept" always;
        add_header Link "</llms.txt>; rel=\"describedby\"" always;
        add_header x-markdown-tokens "4818" always; # md-tokens:/index.md
        include /etc/nginx/snippets/smartsht-security-headers.conf;
        try_files /index.md =404;
    }

    # Extensionless legal URLs have no MIME suffix. default_type keeps them HTML.
    location = /terms {
        if ($wants_markdown = 1) {
            rewrite ^ /terms.md last;
        }
        default_type text/html;
        charset utf-8;
        try_files /terms.html =404;
        add_header Vary "Accept" always;
        add_header Link "</terms.md>; rel=\"alternate\"; type=\"text/markdown\", </llms.txt>; rel=\"describedby\"" always;
        add_header Cache-Control "no-cache, must-revalidate" always;
        include /etc/nginx/snippets/smartsht-security-headers.conf;
    }

    location = /privacy {
        if ($wants_markdown = 1) {
            rewrite ^ /privacy.md last;
        }
        default_type text/html;
        charset utf-8;
        try_files /privacy.html =404;
        add_header Vary "Accept" always;
        add_header Link "</privacy.md>; rel=\"alternate\"; type=\"text/markdown\", </llms.txt>; rel=\"describedby\"" always;
        add_header Cache-Control "no-cache, must-revalidate" always;
        include /etc/nginx/snippets/smartsht-security-headers.conf;
    }

    location = /terms.md {
        types { text/markdown md; }
        default_type text/markdown;
        charset utf-8;
        charset_types text/markdown;
        add_header Content-Type "text/markdown; charset=utf-8" always;
        add_header Vary "Accept" always;
        add_header Link "</llms.txt>; rel=\"describedby\"" always;
        add_header x-markdown-tokens "1284" always; # md-tokens:/terms.md
        include /etc/nginx/snippets/smartsht-security-headers.conf;
        try_files /terms.md =404;
    }

    location = /privacy.md {
        types { text/markdown md; }
        default_type text/markdown;
        charset utf-8;
        charset_types text/markdown;
        add_header Content-Type "text/markdown; charset=utf-8" always;
        add_header Vary "Accept" always;
        add_header Link "</llms.txt>; rel=\"describedby\"" always;
        add_header x-markdown-tokens "1241" always; # md-tokens:/privacy.md
        include /etc/nginx/snippets/smartsht-security-headers.conf;
        try_files /privacy.md =404;
    }

    location = /excel-alternative {
        if ($wants_markdown = 1) {
            rewrite ^ /excel-alternative.md last;
        }
        default_type text/html;
        charset utf-8;
        try_files /excel-alternative.html =404;
        add_header Vary "Accept" always;
        add_header Link "</excel-alternative.md>; rel=\"alternate\"; type=\"text/markdown\", </llms.txt>; rel=\"describedby\"" always;
        add_header Cache-Control "no-cache, must-revalidate" always;
        include /etc/nginx/snippets/smartsht-security-headers.conf;
    }

    location = /formula-auditor {
        if ($wants_markdown = 1) {
            rewrite ^ /formula-auditor.md last;
        }
        default_type text/html;
        charset utf-8;
        try_files /formula-auditor.html =404;
        add_header Vary "Accept" always;
        add_header Link "</formula-auditor.md>; rel=\"alternate\"; type=\"text/markdown\", </llms.txt>; rel=\"describedby\"" always;
        add_header Cache-Control "no-cache, must-revalidate" always;
        include /etc/nginx/snippets/smartsht-security-headers.conf;
    }

    location = /excel-alternative.md {
        types { text/markdown md; }
        default_type text/markdown;
        charset utf-8;
        charset_types text/markdown;
        add_header Content-Type "text/markdown; charset=utf-8" always;
        add_header Vary "Accept" always;
        add_header Link "</llms.txt>; rel=\"describedby\"" always;
        add_header x-markdown-tokens "1034" always; # md-tokens:/excel-alternative.md
        include /etc/nginx/snippets/smartsht-security-headers.conf;
        try_files /excel-alternative.md =404;
    }

    location = /formula-auditor.md {
        types { text/markdown md; }
        default_type text/markdown;
        charset utf-8;
        charset_types text/markdown;
        add_header Content-Type "text/markdown; charset=utf-8" always;
        add_header Vary "Accept" always;
        add_header Link "</llms.txt>; rel=\"describedby\"" always;
        add_header x-markdown-tokens "871" always; # md-tokens:/formula-auditor.md
        include /etc/nginx/snippets/smartsht-security-headers.conf;
        try_files /formula-auditor.md =404;
    }

    location = /excel-alternative/ { return 301 https://smartsht.com/excel-alternative; }
    location = /formula-auditor/ { return 301 https://smartsht.com/formula-auditor; }
    location = /excel-alternative.html { return 301 https://smartsht.com/excel-alternative; }
    location = /formula-auditor.html { return 301 https://smartsht.com/formula-auditor; }

    location = /terms/ { return 301 https://smartsht.com/terms; }
    location = /privacy/ { return 301 https://smartsht.com/privacy; }
    location = /terms.html { return 301 https://smartsht.com/terms; }
    location = /privacy.html { return 301 https://smartsht.com/privacy; }

    # ─── Shared workbook links (/shared/:token) — serve SPA ───
    location /shared/ {
        rewrite ^ /app/index.html last;
    }

    # ─── App (built SPA) ───
    location /app/ {
        alias /var/www/smartsht/app/;
        index index.html;
        try_files $uri $uri/ /app/index.html;
    }

    # Service worker must not be cached. A 30-day cache leaves browsers on an
    # old worker that serves a cached document with a stale CSP (blocks WASM
    # and Cloudflare Insights / Clerk CAPTCHA).
    location = /app/sw.js {
        alias /var/www/smartsht/app/sw.js;
        default_type application/javascript;
        add_header Cache-Control "no-cache, must-revalidate" always;
        include /etc/nginx/snippets/smartsht-security-headers.conf;
    }

    # ─── WebAssembly modules (ort-wasm, formualizer, emscripten) ───
    # Served from /app/assets as hashed files. Explicit MIME type so streaming
    # instantiation works under X-Content-Type-Options: nosniff, even if the
    # distro mime.types lacks a .wasm mapping. Hashed names → long cache.
    location ~* \.wasm$ {
        default_type application/wasm;
        expires 30d;
        add_header Cache-Control "public, no-transform";
        include /etc/nginx/snippets/smartsht-security-headers.conf;
    }

    # ─── Landing page (no SPA fallback: unknown URLs must 404, not the homepage) ───
    error_page 404 /404.html;
    location = /404.html {
        default_type text/html;
        charset utf-8;
        internal;
        add_header Cache-Control "no-cache, must-revalidate" always;
        include /etc/nginx/snippets/smartsht-security-headers.conf;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    # ─── Replaceable branding (unversioned URLs) ───
    # Logos/favicons keep stable paths across deploys. A 30-day fresh lifetime
    # would strand returning visitors on old marks after a brand swap. Force
    # revalidation (304s still cheap). Match domain-root and /app/ copies
    # (Vite mirrors public/ into the SPA). This regex MUST sit above the
    # general static-asset location so it wins first-match among regexes.
    # No `always` on Cache-Control: do not teach browsers to cache 404s for
    # missing icons during a rolling deploy.
    location ~* ^(?:/app)?/(?:favicon(?:\.ico|-\d+x\d+\.png|\.svg)|apple-touch-icon\.png|logo\.png|smart-logo\.(?:png|webp)|smart-favicon\.png|pwa-icon-\d+\.png|og-image\.png)$ {
        expires -1;
        add_header Cache-Control "no-cache, must-revalidate";
        include /etc/nginx/snippets/smartsht-security-headers.conf;
    }

    # ─── Static asset caching ───
    # Note: security headers are repeated via the snippet because nginx drops
    # parent add_header directives when a child block defines its own.
    # Cache-Control has no `always`: error responses (e.g. 404 for a removed
    # hashed asset mid-deploy) must not inherit a 30-day freshness lifetime.
    location ~* \.(css|js|jpg|jpeg|png|gif|ico|svg|webp|woff|woff2)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, no-transform";
        include /etc/nginx/snippets/smartsht-security-headers.conf;
    }

    # ─── RFC 8615 well-known URIs ───
    # Must stay reachable: security.txt, ACME challenges, app-association files.
    # `^~` beats the regex deny below. Negative lookahead on the deny also
    # keeps /app/.well-known/ reachable (Vite copies public/.well-known there).
    location ^~ /.well-known/ {
        allow all;
        default_type text/plain;
        charset utf-8;
    }

    # ─── Block other dotfiles (.git, .env, .htaccess) ───
    location ~ /\.(?!well-known/) { deny all; }

    # ─── SSL (Let's Encrypt) ───
    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/smartsht.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/smartsht.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

# ─── HTTP → HTTPS redirect ───
# ACME http-01 must be served on port 80 before the redirect. A server-level
# `return` would skip locations, so the challenge lives in its own prefix and
# everything else 301s.
server {
    listen 80;
    server_name smartsht.com www.smartsht.com;

    location ^~ /.well-known/acme-challenge/ {
        allow all;
        default_type text/plain;
        root /var/www/smartsht;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
