server {
    server_name smartsht.com www.smartsht.com;

    root /var/www/smartsht;
    index index.html;

    # ─── Body size limit (must match Express workbookBodyLimit) ───
    client_max_body_size 25m;

    # ─── Security Headers ───
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' 'wasm-unsafe-eval' https://js.stripe.com https://static.cloudflareinsights.com https://*.clerk.accounts.dev https://clerk.smartsht.com https://challenges.cloudflare.com https://*.protect.clerk.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://img.clerk.com; connect-src 'self' https://*.clerk.accounts.dev https://clerk.smartsht.com https://api.clerk.com https://clerk-telemetry.com https://*.clerk-telemetry.com https://*.protect.clerk.com https://challenges.cloudflare.com https://api.stripe.com https://openrouter.ai https://api.groq.com https://router.huggingface.co; frame-src https://js.stripe.com https://hooks.stripe.com https://*.clerk.accounts.dev https://clerk.smartsht.com https://challenges.cloudflare.com https://*.protect.clerk.com; worker-src 'self' blob:;" always;

    # ─── Compression ───
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1000;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # ─── API proxy — routes to Express server ───
    location /api/ {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 120s;
        chunked_transfer_encoding off;
    }

    # ─── Health check ───
    location /health {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # ─── AI / crawler text files (must not fall through to index.html) ───
    location = /llms.txt {
        default_type text/plain;
        add_header Content-Type "text/plain; charset=utf-8" always;
        try_files /llms.txt =404;
    }

    location = /robots.txt {
        default_type text/plain;
        try_files /robots.txt =404;
    }

    location = /sitemap.xml {
        default_type application/xml;
        try_files /sitemap.xml =404;
    }

    # ─── Legal pages (extensionless URLs must set HTML MIME; nginx would otherwise serve octet-stream) ───
    location = /terms {
        default_type text/html;
        charset utf-8;
        alias /var/www/smartsht/terms.html;
    }

    location = /privacy {
        default_type text/html;
        charset utf-8;
        alias /var/www/smartsht/privacy.html;
    }

    location = /terms/ { return 301 https://smartsht.com/terms; }
    location = /privacy/ { return 301 https://smartsht.com/privacy; }
    location = /terms.html { return 301 https://smartsht.com/terms; }
    location = /privacy.html { return 301 https://smartsht.com/privacy; }

    # ─── Shared workbook links (/shared/:token) — serve SPA ───
    location /shared/ {
        rewrite ^ /app/index.html last;
    }

    # ─── App (built SPA) ───
    location /app/ {
        alias /var/www/smartsht/app/;
        index index.html;
        try_files $uri $uri/ /app/index.html;
    }

    # Service worker must not be cached. A 30-day cache leaves browsers on an
    # old worker that serves a cached document with a stale CSP (blocks WASM
    # and Cloudflare Insights / Clerk CAPTCHA).
    location = /app/sw.js {
        alias /var/www/smartsht/app/sw.js;
        default_type application/javascript;
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }

    # ─── WebAssembly modules (ort-wasm, formualizer, emscripten) ───
    # Served from /app/assets as hashed files. Explicit MIME type so streaming
    # instantiation works under X-Content-Type-Options: nosniff, even if the
    # distro mime.types lacks a .wasm mapping. Hashed names → long cache.
    location ~* \.wasm$ {
        default_type application/wasm;
        expires 30d;
        add_header Cache-Control "public, no-transform";
        add_header X-Frame-Options SAMEORIGIN always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }

    # ─── Landing page (no SPA fallback: unknown URLs must 404, not the homepage) ───
    error_page 404 /404.html;
    location = /404.html {
        default_type text/html;
        charset utf-8;
        internal;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    # ─── Static asset caching ───
    # Note: security headers are repeated here because nginx drops parent
    # add_header directives when a child block defines its own.
    location ~* \.(css|js|jpg|jpeg|png|gif|ico|svg|woff|woff2)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
        add_header X-Frame-Options SAMEORIGIN always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }

    # ─── Block dotfiles ───
    location ~ /\. { deny all; }

    # ─── SSL (Let's Encrypt) ───
    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/smartsht.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/smartsht.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

# ─── HTTP → HTTPS redirect ───
server {
    listen 80;
    server_name smartsht.com www.smartsht.com;
    return 301 https://$host$request_uri;
}
